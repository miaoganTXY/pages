<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miaogan的浏览器主页</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
  }
  body { overflow: hidden; }

  #bgLayer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #fff;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    pointer-events: none;
  }

  .gear-btn {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 60;
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  .gear-btn:hover { background: rgba(0,0,0,.06); }
  .gear-btn svg { transition: transform .4s; }
  .gear-btn:hover svg { transform: rotate(60deg); }

  .main {
    position: relative;
    z-index: 1;
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 0 20px 16vh;
  }

  /* 实时时间（默认显示，JS 可控制） */
  .clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    align-self: center;
  }
  .clock .hm {
    font-size: 76px;
    font-weight: 700;
    color: #202124;
    letter-spacing: 2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(255,255,255,.8);
    transition: color .3s, text-shadow .3s;
  }
  .clock .md {
    font-size: 17px;
    color: #5f6368;
    letter-spacing: .5px;
    text-shadow: 0 1px 2px rgba(255,255,255,.8);
    transition: color .3s, text-shadow .3s;
  }

  /* 自定义文本（默认隐藏） */
  .custom-text {
    display: none;
    font-size: 72px;
    font-weight: 700;
    color: #202124;
    text-align: center;
    line-height: 1.15;
    letter-spacing: 1px;
    padding: 0 24px;
    max-width: 80vw;
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 1px 2px rgba(255,255,255,.8);
    transition: color .3s, text-shadow .3s;
    align-self: center;
  }

  body.bg-dark .clock .hm {
    color: #ffffff !important;
    text-shadow: 0 1px 6px rgba(0,0,0,.55) !important;
  }
  body.bg-dark .clock .md {
    color: rgba(255,255,255,.9) !important;
    text-shadow: 0 1px 6px rgba(0,0,0,.55) !important;
  }
  body.bg-dark .custom-text {
    color: #ffffff !important;
    text-shadow: 0 1px 6px rgba(0,0,0,.55) !important;
  }

  .search-area {
    position: relative;
    width: min(580px, 92vw);
    margin: 0 auto;
    align-self: center;
  }

  .search-box {
    display: flex;
    align-items: center;
    width: 100%;
    height: 54px;
    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 27px;
    box-shadow: 0 1px 6px rgba(32,33,36,.16);
    padding: 0 8px 0 10px;
    transition: box-shadow .2s, border-color .2s;
  }
  .search-box:focus-within {
    box-shadow: 0 3px 12px rgba(32,33,36,.25);
    border-color: #e8eaed;
  }

  .arrow-btn {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .arrow-btn:hover { background: #f1f3f4; }
  .arrow-btn svg { transition: transform .22s; }
  .arrow-btn.open svg { transform: rotate(180deg); }

  .search-input {
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 17px;
    color: #202124;
    padding: 0 10px;
  }
  .search-input::placeholder { color: #9aa0a6; }

  .search-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .search-btn:hover { background: #f1f3f4; }

  .engine-panel {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 100%;
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 14px;
    box-shadow: 0 6px 22px rgba(32,33,36,.18);
    padding: 20px 16px 16px;
    z-index: 30;
    animation: dropIn .18s ease-out;
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hidden { display: none !important; }

  .engine-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding-top: 6px;
  }

  .engine-item {
    position: relative;
    width: 46px;
    height: 46px;
  }

  .engine-icon {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .15s, box-shadow .15s;
  }
  .engine-icon:hover { transform: translateY(-2px); }
  .engine-icon.active {
    box-shadow: 0 0 0 3px rgba(26,115,232,.55);
  }

  .engine-del {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #5f6368;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.28);
    transition: background .15s, color .15s, transform .15s;
    z-index: 2;
  }
  .engine-del:hover {
    background: #d93025;
    color: #fff;
    transform: scale(1.12);
  }

  .plus-square {
    width: 46px;
    height: 46px;
    border: 2px solid #dadce0;
    border-radius: 8px;
    background: #fff;
    color: #1a73e8;
    font-size: 28px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: border-color .18s, background .18s;
  }
  .plus-square:hover {
    border-color: #1a73e8;
    background: #f5f9ff;
  }
  .plus-square.small {
    width: 30px;
    height: 30px;
    font-size: 19px;
    border-radius: 6px;
  }

  .add-form {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #f1f3f4;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .add-form input {
    height: 36px;
    padding: 0 12px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    color: #202124;
    transition: border-color .18s;
  }
  .add-form input:focus { border-color: #1a73e8; }
  #newName { flex: 0 0 130px; }
  #newUrl  { flex: 1 1 220px; min-width: 180px; }
  .add-form button {
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-size: 14px;
    cursor: pointer;
    transition: background .18s;
  }
  #confirmAdd { background: #1a73e8; color: #fff; }
  #confirmAdd:hover { background: #1667d0; }
  #cancelAdd {
    background: #fff;
    color: #5f6368;
    border-color: #dadce0;
  }
  #cancelAdd:hover { background: #f1f3f4; }

  /* ---------- 设置弹窗 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(32,33,36,.28);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .settings-panel {
    position: relative;
    width: min(600px, 92vw);
    max-height: 85vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,.28);
    padding: 46px 40px 36px;
    animation: popIn .2s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  .close-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 24px;
    line-height: 1;
    color: #5f6368;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .close-btn:hover { background: #f1f3f4; }

  .setting-block {
    padding: 18px 0;
    border-bottom: 1px solid #f1f3f4;
  }
  .setting-block:first-of-type { padding-top: 0; }
  .setting-block:last-of-type { border-bottom: none; padding-bottom: 0; }

  .setting-label {
    font-size: 16px;
    font-weight: 600;
    color: #202124;
    margin-bottom: 14px;
    display: block;
  }

  .setting-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 15px;
    color: #3c4043;
  }

  .reset-btn {
    height: 30px;
    padding: 0 12px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    background: #fff;
    color: #1a73e8;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .18s, background .18s, color .18s;
  }
  .reset-btn:hover {
    border-color: #1a73e8;
    background: #f5f9ff;
  }

  .mode-box {
    height: 34px;
    padding: 0 18px;
    border: 2px solid #dadce0;
    border-radius: 8px;
    background: #fff;
    color: #5f6368;
    font-size: 14px;
    cursor: pointer;
    transition: border-color .18s, background .18s, color .18s, font-weight .18s;
  }
  .mode-box:hover { border-color: #1a73e8; }
  .mode-box.active {
    border-color: #1a73e8;
    background: #e8f0fe;
    color: #1a73e8;
    font-weight: 700;
  }

  .text-input-wrapper {
    margin-top: 16px;
  }
  .text-input-wrapper textarea {
    width: 100%;
    min-height: 76px;
    padding: 10px 12px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #202124;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    transition: border-color .18s;
  }
  .text-input-wrapper textarea:focus { border-color: #1a73e8; }

  @media (max-width: 560px) {
    .clock .hm { font-size: 52px; }
    .clock .md { font-size: 14px; }
    .custom-text { font-size: 44px; }
    .search-input { font-size: 15px; }
    .engine-item, .plus-square { width: 42px; height: 42px; }
    .settings-panel { padding: 40px 22px 28px; }
    .main { padding: 0 20px 12vh; }
  }
</style>
</head>
<body>

  <div id="bgLayer"></div>

  <button class="gear-btn" id="gearBtn" title="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5f6368"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div class="main">
    <div class="clock" id="clock"></div>
    <div class="custom-text" id="customText"></div>

    <div class="search-area" id="searchArea">
      <div class="search-box">
        <button class="arrow-btn" id="arrowBtn" title="选择搜索引擎">
          <svg width="13" height="13" viewBox="0 0 12 12">
            <path d="M1 3.5h10L6 9.5z" fill="#5f6368"/>
          </svg>
        </button>

        <input class="search-input" id="searchInput" type="text"
               placeholder="输入搜索内容…" autocomplete="off" spellcheck="false">

        <button class="search-btn" id="searchBtn" title="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="#5f6368" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4.2-4.2"/>
          </svg>
        </button>
      </div>

      <div class="engine-panel hidden" id="enginePanel">
        <div class="engine-list" id="engineList"></div>
        <div class="add-form hidden" id="addForm">
          <input id="newName" type="text" placeholder="名称（如 百度）">
          <input id="newUrl" type="text" placeholder="搜索地址，用 %s 代表关键词">
          <button id="confirmAdd" type="button">添加</button>
          <button id="cancelAdd" type="button">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="overlay hidden" id="settingsOverlay">
    <div class="settings-panel" id="settingsPanel">
      <button class="close-btn" id="closeSettings" title="关闭">×</button>

      <!-- 1. 设置背景 -->
      <div class="setting-block">
        <span class="setting-label">设置背景</span>
        <div class="setting-row">
          <button class="plus-square small" id="bgAddBtn" title="选择图片">+</button>
          <button class="reset-btn" id="resetBgBtn" title="重置为默认纯白背景">重置</button>
          <input type="file" id="bgFileInput" accept="image/*" hidden>
        </div>
      </div>

      <!-- 2. 搜索框上方显示 -->
      <div class="setting-block">
        <span class="setting-label">搜索框上方显示</span>
        <div class="setting-row" id="modeRow">
          <button class="mode-box" data-mode="time" type="button">时间</button>
          <button class="mode-box" data-mode="text" type="button">文本</button>
          <button class="mode-box" data-mode="none" type="button">无</button>
        </div>
        <div class="text-input-wrapper hidden" id="textInputWrapper">
          <textarea id="customTextInput"
                    placeholder="输入要显示在搜索框上方的文字（可多行）"></textarea>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ======================= 存储键 ======================= */
  var STORAGE_KEY = 'miaogan_engines';
  var INDEX_KEY   = 'miaogan_current_engine';
  var BG_KEY      = 'miaogan_bg';
  var MODE_KEY    = 'miaogan_display_mode';
  var TEXT_KEY    = 'miaogan_custom_text';

  var DEFAULT_ENGINES = [
    { name: '百度',   url: 'https://www.baidu.com/s?wd=%s',        color: '#2932e1' },
    { name: 'Bing',   url: 'https://www.bing.com/search?q=%s',     color: '#00897b' },
    { name: 'Google', url: 'https://www.google.com/search?q=%s',   color: '#4285f4' }
  ];

  var PALETTE = ['#2932e1', '#00897b', '#4285f4', '#e8710a',
                 '#d93025', '#7b1fa2', '#0f9d58', '#c2185b'];

  var DARK_THRESHOLD = 170;

  var engines = [];
  var current = 0;
  var displayMode = 'time';      // 'time' | 'text' | 'none'
  var customTextValue = '';

  /* ======================= DOM ======================= */
  var bgLayer        = document.getElementById('bgLayer');
  var clockEl        = document.getElementById('clock');
  var customTextEl   = document.getElementById('customText');
  var gearBtn        = document.getElementById('gearBtn');

  var searchArea     = document.getElementById('searchArea');
  var searchInput    = document.getElementById('searchInput');
  var searchBtn      = document.getElementById('searchBtn');
  var arrowBtn       = document.getElementById('arrowBtn');
  var enginePanel    = document.getElementById('enginePanel');
  var engineList     = document.getElementById('engineList');
  var addForm        = document.getElementById('addForm');
  var newName        = document.getElementById('newName');
  var newUrl         = document.getElementById('newUrl');
  var confirmAdd     = document.getElementById('confirmAdd');
  var cancelAdd      = document.getElementById('cancelAdd');

  var settingsOverlay = document.getElementById('settingsOverlay');
  var settingsPanel   = document.getElementById('settingsPanel');
  var closeSettings   = document.getElementById('closeSettings');
  var bgAddBtn        = document.getElementById('bgAddBtn');
  var resetBgBtn      = document.getElementById('resetBgBtn');
  var bgFileInput     = document.getElementById('bgFileInput');

  var textInputWrapper = document.getElementById('textInputWrapper');
  var customTextInput  = document.getElementById('customTextInput');
  var modeRow          = document.getElementById('modeRow');

  console.log('[初始化] 页面开始加载');
  console.log('[初始化] textInputWrapper =', textInputWrapper);
  console.log('[初始化] customTextInput  =', customTextInput);
  console.log('[初始化] modeRow          =', modeRow);

  /* ======================= 工具函数 ======================= */
  function firstLetter(eng) {
    var s = (eng.name || '').trim();
    if (!s) {
      try { s = new URL(eng.url).hostname.replace(/^www\./, ''); }
      catch (e) { s = eng.url || '?'; }
    }
    return s.charAt(0).toUpperCase();
  }

  function saveEngines() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(engines));
      localStorage.setItem(INDEX_KEY, String(current));
    } catch (e) {}
  }

  function loadEngines() {
    var list = null, idx = 0;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) list = JSON.parse(raw);
      var rawIdx = localStorage.getItem(INDEX_KEY);
      if (rawIdx !== null) idx = parseInt(rawIdx, 10) || 0;
    } catch (e) { list = null; }

    if (!Array.isArray(list) || list.length === 0) {
      list = DEFAULT_ENGINES.map(function (e) {
        return { name: e.name, url: e.url, color: e.color };
      });
    }

    list.forEach(function (e) {
      if (!e.letter) e.letter = firstLetter(e);
      if (!e.color)  e.color  = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    });

    engines = list;
    current = (idx >= 0 && idx < engines.length) ? idx : 0;
  }

  /* ======================= 实时时间 ======================= */
  var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function updateClock() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mi = String(d.getMinutes()).padStart(2, '0');
    var mo = d.getMonth() + 1;
    var da = d.getDate();
    clockEl.innerHTML =
      '<span class="hm">' + hh + ':' + mi + '</span>' +
      '<span class="md">' + mo + '月' + da + '日  ' + WEEK[d.getDay()] + '</span>';
  }

  /* ======================= 自定义文本自适应 ======================= */
  function fitCustomText() {
    var el = customTextEl;
    var text = el.textContent || '';
    if (!text.trim()) {
      el.style.fontSize = '';
      return;
    }

    var maxW = Math.min(window.innerWidth * 0.8, 820);
    var maxH = Math.min(window.innerHeight * 0.38, 300);
    el.style.maxWidth = maxW + 'px';
    el.style.whiteSpace = 'pre-wrap';
    el.style.wordBreak = 'break-word';

    var size = 72;
    var MIN_SIZE = 12;
    el.style.fontSize = size + 'px';

    while (size > MIN_SIZE) {
      el.style.fontSize = size + 'px';
      if (el.offsetHeight <= maxH && el.offsetWidth <= maxW) break;
      size -= 2;
    }
  }

  /* ======================= 显示模式应用 ======================= */
  function applyDisplayMode() {
    console.log('[模式] 应用显示模式 =', displayMode);

    // 更新单选方块高亮
    var boxes = modeRow.querySelectorAll('.mode-box');
    Array.prototype.forEach.call(boxes, function (b) {
      if (b.dataset.mode === displayMode) {
        b.classList.add('active');
      } else {
        b.classList.remove('active');
      }
    });

    // 文本输入框仅在“文本”模式显示
    if (displayMode === 'text') {
      textInputWrapper.classList.remove('hidden');
    } else {
      textInputWrapper.classList.add('hidden');
    }

    // 主区域显示内容
    if (displayMode === 'time') {
      clockEl.style.display = 'flex';
      customTextEl.style.display = 'none';
    } else if (displayMode === 'text') {
      clockEl.style.display = 'none';
      customTextEl.textContent = customTextValue;
      customTextEl.style.display = 'inline-block';
      requestAnimationFrame(fitCustomText);
    } else {
      clockEl.style.display = 'none';
      customTextEl.style.display = 'none';
    }

    try { localStorage.setItem(MODE_KEY, displayMode); } catch (e) {}
  }

  /* ======================= 背景明暗检测 ======================= */
  function detectBgBrightness(dataUrl, callback) {
    var img = new Image();
    var done = false;
    function finish(val) {
      if (done) return;
      done = true;
      callback(val);
    }
    var timer = setTimeout(function () { finish(255); }, 3000);

    img.onload = function () {
      clearTimeout(timer);
      try {
        var size = 64;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);

        var data = ctx.getImageData(0, 0, size, size).data;
        var sum = 0, n = 0;
        for (var i = 0; i < data.length; i += 4) {
          sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          n++;
        }
        finish(n ? sum / n : 255);
      } catch (e) {
        finish(255);
      }
    };
    img.onerror = function () { clearTimeout(timer); finish(255); };
    img.src = dataUrl;
  }

  function updateClockColor(brightness) {
    if (brightness < DARK_THRESHOLD) {
      document.body.classList.add('bg-dark');
    } else {
      document.body.classList.remove('bg-dark');
    }
  }

  function applyBg(dataUrl) {
    if (dataUrl) {
      bgLayer.style.backgroundImage = 'url("' + dataUrl + '")';
      requestAnimationFrame(function () {
        detectBgBrightness(dataUrl, updateClockColor);
      });
    } else {
      bgLayer.style.backgroundImage = 'none';
      bgLayer.style.backgroundColor = '#fff';
      document.body.classList.remove('bg-dark');
    }
  }

  function loadBg() {
    try {
      var saved = localStorage.getItem(BG_KEY);
      if (saved && saved.indexOf('data:image') === 0) applyBg(saved);
    } catch (e) {}
  }

  /* ======================= 渲染搜索引擎 ======================= */
  function renderEngines() {
    if (engines.length === 0) {
      current = -1;
    } else if (current < 0 || current >= engines.length) {
      current = 0;
    }

    engineList.innerHTML = '';

    engines.forEach(function (eng, i) {
      var item = document.createElement('div');
      item.className = 'engine-item';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'engine-icon' + (i === current ? ' active' : '');
      btn.style.background = eng.color;
      btn.textContent = eng.letter;
      btn.title = eng.name;

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        current = i;
        saveEngines();
        renderEngines();
        searchInput.focus();
      });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'engine-del';
      del.textContent = '×';
      del.title = '删除「' + eng.name + '」';

      del.addEventListener('click', function (e) {
        e.stopPropagation();
        engines.splice(i, 1);
        if (current >= engines.length) current = engines.length - 1;
        if (current < 0) current = 0;
        saveEngines();
        renderEngines();
      });

      item.appendChild(btn);
      item.appendChild(del);
      engineList.appendChild(item);
    });

    var plus = document.createElement('button');
    plus.type = 'button';
    plus.className = 'plus-square';
    plus.textContent = '+';
    plus.title = '添加搜索引擎';
    plus.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleAddForm();
    });
    engineList.appendChild(plus);
  }

  /* ======================= 面板开合 ======================= */
  function openPanel() {
    enginePanel.classList.remove('hidden');
    arrowBtn.classList.add('open');
  }

  function closePanel() {
    enginePanel.classList.add('hidden');
    arrowBtn.classList.remove('open');
    addForm.classList.add('hidden');
    newName.value = '';
    newUrl.value = '';
  }

  function togglePanel() {
    if (enginePanel.classList.contains('hidden')) openPanel();
    else closePanel();
  }

  function toggleAddForm() {
    var hidden = addForm.classList.toggle('hidden');
    if (!hidden) newName.focus();
    else { newName.value = ''; newUrl.value = ''; }
  }

  arrowBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePanel();
  });

  document.addEventListener('click', function (e) {
    if (!searchArea.contains(e.target)) closePanel();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closePanel();
      settingsOverlay.classList.add('hidden');
    }
  });

  /* ======================= 添加搜索引擎 ======================= */
  confirmAdd.addEventListener('click', function () {
    var url = newUrl.value.trim();
    if (!url) {
      alert('请输入搜索地址，例如：https://www.baidu.com/s?wd=%s');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    var name = newName.value.trim();
    if (!name) {
      try { name = new URL(url).hostname.replace(/^www\./, ''); }
      catch (e) { name = url; }
    }

    var eng = { name: name, url: url };
    eng.letter = firstLetter(eng);
    eng.color = PALETTE[engines.length % PALETTE.length];

    engines.push(eng);
    current = engines.length - 1;
    saveEngines();
    renderEngines();

    newName.value = '';
    newUrl.value = '';
    addForm.classList.add('hidden');
    searchInput.focus();
  });

  cancelAdd.addEventListener('click', function (e) {
    e.stopPropagation();
    addForm.classList.add('hidden');
    newName.value = '';
    newUrl.value = '';
  });

  [newName, newUrl].forEach(function (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        confirmAdd.click();
      }
    });
  });

  /* ======================= 执行搜索 ======================= */
  function doSearch() {
    var q = searchInput.value.trim();
    if (!q) { searchInput.focus(); return; }
    var eng = engines[current] || engines[0];
    if (!eng) { alert('请先添加一个搜索引擎'); return; }

    var url;
    if (eng.url.indexOf('%s') !== -1) {
      url = eng.url.replace('%s', encodeURIComponent(q));
    } else {
      url = eng.url + encodeURIComponent(q);
    }
    window.location.href = url;
  }

  searchBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    doSearch();
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doSearch();
    }
  });

  /* ======================= 设置弹窗 ======================= */
  gearBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    settingsOverlay.classList.remove('hidden');
    closePanel();
  });

  closeSettings.addEventListener('click', function () {
    settingsOverlay.classList.add('hidden');
  });

  settingsOverlay.addEventListener('click', function (e) {
    if (!settingsPanel.contains(e.target)) {
      settingsOverlay.classList.add('hidden');
    }
  });

  /* ======================= 显示模式切换（事件委托 + 直接绑定双保险） ======================= */
  function handleModeClick(e) {
    var target = e.target;
    if (target && target.classList && target.classList.contains('mode-box')) {
      e.stopPropagation();
      var mode = target.dataset.mode;
      console.log('[模式] 点击了 =', mode);
      if (mode === 'time' || mode === 'text' || mode === 'none') {
        displayMode = mode;
        applyDisplayMode();
      }
    }
  }
  // 直接在 row 上用事件委托
  modeRow.addEventListener('click', handleModeClick);

  /* ======================= 自定义文本输入 ======================= */
  customTextInput.addEventListener('input', function () {
    customTextValue = customTextInput.value;
    try { localStorage.setItem(TEXT_KEY, customTextValue); } catch (e) {}
    if (displayMode === 'text') {
      customTextEl.textContent = customTextValue;
      fitCustomText();
    }
  });

  window.addEventListener('resize', function () {
    if (displayMode === 'text') fitCustomText();
  });

  /* ======================= 背景图片选择 ======================= */
  bgAddBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    bgFileInput.click();
  });

  bgFileInput.addEventListener('change', function () {
    var file = bgFileInput.files && bgFileInput.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function (ev) {
      var dataUrl = ev.target.result;
      applyBg(dataUrl);
      try { localStorage.setItem(BG_KEY, dataUrl); }
      catch (err) {
        alert('图片过大，无法保存到本地，刷新页面后将恢复默认背景。');
      }
    };
    reader.readAsDataURL(file);
    bgFileInput.value = '';
  });

  /* ======================= 重置背景 ======================= */
  resetBgBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    try { localStorage.removeItem(BG_KEY); } catch (err) {}
    applyBg(null);
  });

  /* ======================= 初始化 ======================= */
  console.log('[初始化] 加载搜索引擎...');
  loadEngines();
  renderEngines();

  // 读取显示模式与自定义文本
  try {
    var savedMode = localStorage.getItem(MODE_KEY);
    if (savedMode === 'time' || savedMode === 'text' || savedMode === 'none') {
      displayMode = savedMode;
    }
    var savedText = localStorage.getItem(TEXT_KEY);
    if (savedText !== null) {
      customTextValue = savedText;
      customTextInput.value = savedText;
    }
  } catch (e) {}

  loadBg();
  console.log('[初始化] 应用显示模式...');
  applyDisplayMode();
  updateClock();
  setInterval(updateClock, 1000);

  console.log('[初始化] 全部完成');

})();
</script>
</body>
</html>
