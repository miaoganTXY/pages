<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miaogan的浏览器主页</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff;
  }
  body { overflow: hidden; }

  /* ---------- 背景图片层（在搜索框下方 / 视觉最底层） ---------- */
  #bgLayer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-color: #fff;
    background-size: cover;          /* 等比铺满页面 */
    background-position: center center;
    background-repeat: no-repeat;
    pointer-events: none;
  }

  /* ---------- 右上角齿轮 ---------- */
  .gear-btn {
    position: fixed;
    top: 18px;
    right: 22px;
    z-index: 60;
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s;
  }
  .gear-btn:hover { background: rgba(0,0,0,.06); }
  .gear-btn svg { transition: transform .4s; }
  .gear-btn:hover svg { transform: rotate(60deg); }

  /* ---------- 主区域（整体上移：增加底部内边距） ---------- */
  .main {
    position: relative;
    z-index: 1;
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;       /* 所有子元素水平居中 */
    justify-content: center;   /* 整体垂直居中 */
    gap: 30px;
    padding: 0 20px 16vh;      /* 底部留白，使内容整体上移 */
  }

  /* ---------- 实时时间（时:分 在上方更大，日期星期在下方） ---------- */
  .clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    text-shadow: 0 1px 2px rgba(255,255,255,.8);
    align-self: center;
  }
  .clock .hm {
    font-size: 76px;          /* 时:分 上方大号突出 */
    font-weight: 700;
    color: #202124;
    letter-spacing: 2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock .md {
    font-size: 17px;          /* 日期、星期 下方小字 */
    color: #5f6368;
    letter-spacing: .5px;
  }

  /* ---------- 搜索区域（水平居中） ---------- */
  .search-area {
    position: relative;
    width: min(580px, 92vw);
    margin: 0 auto;
    align-self: center;
  }

  /* 椭圆搜索框 */
  .search-box {
    display: flex;
    align-items: center;
    width: 100%;
    height: 54px;
    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 27px;               /* 椭圆形 */
    box-shadow: 0 1px 6px rgba(32,33,36,.16);
    padding: 0 8px 0 10px;
    transition: box-shadow .2s, border-color .2s;
  }
  .search-box:focus-within {
    box-shadow: 0 3px 12px rgba(32,33,36,.25);
    border-color: #e8eaed;
  }

  /* 左侧倒三角 */
  .arrow-btn {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .arrow-btn:hover { background: #f1f3f4; }
  .arrow-btn svg { transition: transform .22s; }
  .arrow-btn.open svg { transform: rotate(180deg); }

  /* 输入框 */
  .search-input {
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-size: 17px;
    color: #202124;
    padding: 0 10px;
  }
  .search-input::placeholder { color: #9aa0a6; }

  /* 右侧放大镜 */
  .search-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .search-btn:hover { background: #f1f3f4; }

  /* ---------- 搜索引擎面板 ---------- */
  .engine-panel {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    width: 100%;
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 14px;
    box-shadow: 0 6px 22px rgba(32,33,36,.18);
    padding: 16px;
    z-index: 30;
    animation: dropIn .18s ease-out;
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hidden { display: none !important; }

  .engine-list {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  /* 引擎图标 */
  .engine-icon {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 19px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .15s, box-shadow .15s;
    position: relative;
  }
  .engine-icon:hover { transform: translateY(-2px); }
  .engine-icon.active {
    box-shadow: 0 0 0 3px rgba(26,115,232,.55);
  }

  /* 带描边的正方形 + 按钮 */
  .plus-square {
    width: 46px;
    height: 46px;
    border: 2px solid #dadce0;
    border-radius: 8px;
    background: #fff;
    color: #1a73e8;
    font-size: 28px;
    font-weight: 400;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: border-color .18s, background .18s;
  }
  .plus-square:hover {
    border-color: #1a73e8;
    background: #f5f9ff;
  }
  .plus-square.small {
    width: 30px;
    height: 30px;
    font-size: 19px;
    border-radius: 6px;
  }

  /* 添加引擎表单 */
  .add-form {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #f1f3f4;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .add-form input {
    height: 36px;
    padding: 0 12px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    color: #202124;
    transition: border-color .18s;
  }
  .add-form input:focus { border-color: #1a73e8; }
  #newName { flex: 0 0 130px; }
  #newUrl  { flex: 1 1 220px; min-width: 180px; }
  .add-form button {
    height: 36px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-size: 14px;
    cursor: pointer;
    transition: background .18s;
  }
  #confirmAdd {
    background: #1a73e8;
    color: #fff;
  }
  #confirmAdd:hover { background: #1667d0; }
  #cancelAdd {
    background: #fff;
    color: #5f6368;
    border-color: #dadce0;
  }
  #cancelAdd:hover { background: #f1f3f4; }

  /* ---------- 设置弹窗 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(32,33,36,.28);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn .18s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .settings-panel {
    position: relative;
    width: min(520px, 90vw);
    min-height: 300px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,.28);
    padding: 46px 40px;
    animation: popIn .2s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 关闭 × */
  .close-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 24px;
    line-height: 1;
    color: #5f6368;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .18s;
  }
  .close-btn:hover { background: #f1f3f4; }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    color: #202124;
  }

  @media (max-width: 560px) {
    .clock .hm { font-size: 52px; }
    .clock .md { font-size: 14px; }
    .search-input { font-size: 15px; }
    .engine-icon, .plus-square { width: 42px; height: 42px; }
    .settings-panel { padding: 40px 24px; }
    .main { padding: 0 20px 12vh; }
  }
</style>
</head>
<body>

  <!-- 背景图片层（铺满页面、在搜索框下方） -->
  <div id="bgLayer"></div>

  <!-- 右上角齿轮 -->
  <button class="gear-btn" id="gearBtn" title="设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5f6368"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <!-- 主区域 -->
  <div class="main">
    <div class="clock" id="clock"></div>

    <div class="search-area" id="searchArea">
      <!-- 椭圆搜索框 -->
      <div class="search-box">
        <button class="arrow-btn" id="arrowBtn" title="选择搜索引擎">
          <svg width="13" height="13" viewBox="0 0 12 12">
            <path d="M1 3.5h10L6 9.5z" fill="#5f6368"/>
          </svg>
        </button>

        <input class="search-input" id="searchInput" type="text"
               placeholder="输入搜索内容…" autocomplete="off" spellcheck="false">

        <button class="search-btn" id="searchBtn" title="搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="#5f6368" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-4.2-4.2"/>
          </svg>
        </button>
      </div>

      <!-- 搜索引擎面板 -->
      <div class="engine-panel hidden" id="enginePanel">
        <div class="engine-list" id="engineList"></div>

        <!-- 添加引擎表单 -->
        <div class="add-form hidden" id="addForm">
          <input id="newName" type="text" placeholder="名称（如 百度）">
          <input id="newUrl" type="text" placeholder="搜索地址，用 %s 代表关键词">
          <button id="confirmAdd" type="button">添加</button>
          <button id="cancelAdd" type="button">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="overlay hidden" id="settingsOverlay">
    <div class="settings-panel" id="settingsPanel">
      <button class="close-btn" id="closeSettings" title="关闭">×</button>

      <div class="setting-row">
        <span>设置背景</span>
        <button class="plus-square small" id="bgAddBtn" title="选择图片">+</button>
        <input type="file" id="bgFileInput" accept="image/*" hidden>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ======================= 数据与状态 ======================= */
  const STORAGE_KEY = 'miaogan_engines';
  const INDEX_KEY   = 'miaogan_current_engine';

  const DEFAULT_ENGINES = [
    { name: '百度',   url: 'https://www.baidu.com/s?wd=%s',        color: '#2932e1' },
    { name: 'Bing',   url: 'https://www.bing.com/search?q=%s',     color: '#00897b' },
    { name: 'Google', url: 'https://www.google.com/search?q=%s',   color: '#4285f4' }
  ];

  const PALETTE = ['#2932e1', '#00897b', '#4285f4', '#e8710a',
                   '#d93025', '#7b1fa2', '#0f9d58', '#c2185b'];

  let engines = [];
  let current = 0;

  /* ======================= DOM ======================= */
  const bgLayer        = document.getElementById('bgLayer');
  const clockEl        = document.getElementById('clock');
  const gearBtn        = document.getElementById('gearBtn');

  const searchArea     = document.getElementById('searchArea');
  const searchInput    = document.getElementById('searchInput');
  const searchBtn      = document.getElementById('searchBtn');
  const arrowBtn       = document.getElementById('arrowBtn');
  const enginePanel    = document.getElementById('enginePanel');
  const engineList     = document.getElementById('engineList');
  const addForm        = document.getElementById('addForm');
  const newName        = document.getElementById('newName');
  const newUrl         = document.getElementById('newUrl');
  const confirmAdd     = document.getElementById('confirmAdd');
  const cancelAdd      = document.getElementById('cancelAdd');

  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsPanel   = document.getElementById('settingsPanel');
  const closeSettings   = document.getElementById('closeSettings');
  const bgAddBtn        = document.getElementById('bgAddBtn');
  const bgFileInput     = document.getElementById('bgFileInput');

  /* ======================= 工具函数 ======================= */
  function firstLetter(eng) {
    let s = (eng.name || '').trim();
    if (!s) {
      try {
        s = new URL(eng.url).hostname.replace(/^www\./, '');
      } catch (e) {
        s = eng.url || '?';
      }
    }
    return s.charAt(0).toUpperCase();
  }

  function saveEngines() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(engines));
      localStorage.setItem(INDEX_KEY, String(current));
    } catch (e) { /* 忽略存储异常 */ }
  }

  function loadEngines() {
    let list = null;
    let idx = 0;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) list = JSON.parse(raw);
      const rawIdx = localStorage.getItem(INDEX_KEY);
      if (rawIdx !== null) idx = parseInt(rawIdx, 10) || 0;
    } catch (e) { list = null; }

    if (!Array.isArray(list) || list.length === 0) {
      list = DEFAULT_ENGINES.map(function (e) {
        return { name: e.name, url: e.url, color: e.color };
      });
    }

    list.forEach(function (e) {
      if (!e.letter) e.letter = firstLetter(e);
      if (!e.color)  e.color  = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    });

    engines = list;
    current = (idx >= 0 && idx < engines.length) ? idx : 0;
  }

  /* ======================= 实时时间 ======================= */
  const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

  function updateClock() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    const mo = d.getMonth() + 1;
    const da = d.getDate();
    // 时:分 在上方（大），月日星期 在下方（小）
    clockEl.innerHTML =
      '<span class="hm">' + hh + ':' + mi + '</span>' +
      '<span class="md">' + mo + '月' + da + '日  ' + WEEK[d.getDay()] + '</span>';
  }

  /* ======================= 长按检测 ======================= */
  function attachLongPress(el, onLongPress) {
    let timer = null;
    let fired = false;

    function clearTimer() {
      if (timer) { clearTimeout(timer); timer = null; }
    }

    el.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;          // 只响应左键
      fired = false;
      clearTimer();
      timer = setTimeout(function () {
        timer = null;
        fired = true;
        onLongPress();
      }, 600);                             // 长按 0.6 秒
    });

    el.addEventListener('mouseup', clearTimer);
    el.addEventListener('mouseleave', clearTimer);
    el.addEventListener('dragstart', function (e) { e.preventDefault(); });

    // 返回一个“本次点击是否由长按触发”的查询函数
    return function () {
      const f = fired;
      fired = false;
      return f;
    };
  }

  /* ======================= 渲染搜索引擎 ======================= */
  function renderEngines() {
    if (engines.length === 0) {
      current = -1;
    } else if (current < 0 || current >= engines.length) {
      current = 0;
    }

    engineList.innerHTML = '';

    engines.forEach(function (eng, i) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'engine-icon' + (i === current ? ' active' : '');
      btn.style.background = eng.color;
      btn.textContent = eng.letter;
      btn.title = eng.name + '（长按可删除）';

      // 先绑定长按，拿到“是否长按”的查询器
      const wasLongPress = attachLongPress(btn, function () {
        engines.splice(i, 1);
        if (current >= engines.length) current = engines.length - 1;
        if (current < 0) current = 0;
        saveEngines();
        renderEngines();
      });

      btn.addEventListener('click', function (e) {
        if (wasLongPress()) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        current = i;
        saveEngines();
        renderEngines();
        searchInput.focus();
      });

      engineList.appendChild(btn);
    });

    // 末尾的“+”方块
    const plus = document.createElement('button');
    plus.type = 'button';
    plus.className = 'plus-square';
    plus.textContent = '+';
    plus.title = '添加搜索引擎';
    plus.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleAddForm();
    });
    engineList.appendChild(plus);
  }

  /* ======================= 搜索引擎面板开合 ======================= */
  function openPanel() {
    enginePanel.classList.remove('hidden');
    arrowBtn.classList.add('open');
  }

  function closePanel() {
    enginePanel.classList.add('hidden');
    arrowBtn.classList.remove('open');
    addForm.classList.add('hidden');
    newName.value = '';
    newUrl.value = '';
  }

  function togglePanel() {
    if (enginePanel.classList.contains('hidden')) {
      openPanel();
    } else {
      closePanel();
    }
  }

  function toggleAddForm() {
    const hidden = addForm.classList.toggle('hidden');
    if (!hidden) {
      newName.focus();
    } else {
      newName.value = '';
      newUrl.value = '';
    }
  }

  arrowBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePanel();
  });

  // 点击页面其他地方关闭面板
  document.addEventListener('click', function (e) {
    if (!searchArea.contains(e.target)) {
      closePanel();
    }
  });

  // Esc 关闭
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closePanel();
      settingsOverlay.classList.add('hidden');
    }
  });

  /* ======================= 添加搜索引擎 ======================= */
  confirmAdd.addEventListener('click', function () {
    let url = newUrl.value.trim();
    if (!url) {
      alert('请输入搜索地址，例如：https://www.baidu.com/s?wd=%s');
      return;
    }
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    let name = newName.value.trim();
    if (!name) {
      try {
        name = new URL(url).hostname.replace(/^www\./, '');
      } catch (e) {
        name = url;
      }
    }

    const eng = { name: name, url: url };
    eng.letter = firstLetter(eng);
    eng.color = PALETTE[engines.length % PALETTE.length];

    engines.push(eng);
    current = engines.length - 1;

    saveEngines();
    renderEngines();

    newName.value = '';
    newUrl.value = '';
    addForm.classList.add('hidden');
    searchInput.focus();
  });

  cancelAdd.addEventListener('click', function (e) {
    e.stopPropagation();
    addForm.classList.add('hidden');
    newName.value = '';
    newUrl.value = '';
  });

  // 输入框里按回车直接添加
  [newName, newUrl].forEach(function (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        confirmAdd.click();
      }
    });
  });

  /* ======================= 执行搜索 ======================= */
  function doSearch() {
    const q = searchInput.value.trim();
    if (!q) {
      searchInput.focus();
      return;
    }
    const eng = engines[current] || engines[0];
    if (!eng) {
      alert('请先添加一个搜索引擎');
      return;
    }

    let url;
    if (eng.url.indexOf('%s') !== -1) {
      url = eng.url.replace('%s', encodeURIComponent(q));
    } else {
      url = eng.url + encodeURIComponent(q);
    }
    window.location.href = url;
  }

  searchBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    doSearch();
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doSearch();
    }
  });

  /* ======================= 设置弹窗 ======================= */
  gearBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    settingsOverlay.classList.remove('hidden');
    closePanel();
  });

  closeSettings.addEventListener('click', function () {
    settingsOverlay.classList.add('hidden');
  });

  // 点击遮罩空白处关闭
  settingsOverlay.addEventListener('click', function (e) {
    if (!settingsPanel.contains(e.target)) {
      settingsOverlay.classList.add('hidden');
    }
  });

  /* ======================= 设置背景 ======================= */
  bgAddBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    bgFileInput.click();
  });

  bgFileInput.addEventListener('change', function () {
    const file = bgFileInput.files && bgFileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (ev) {
      bgLayer.style.backgroundImage = 'url("' + ev.target.result + '")';
    };
    reader.readAsDataURL(file);

    // 允许重复选择同一张图片
    bgFileInput.value = '';
  });

  /* ======================= 初始化 ======================= */
  loadEngines();
  renderEngines();
  updateClock();
  setInterval(updateClock, 1000);

})();
</script>
</body>
</html>
