<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>miaogan的小站</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { padding: 40px 0 0 40px; }
  .site-name {
    font-size: 28px;
    font-weight: 700;
    color: #202124;
    letter-spacing: 1px;
  }
  .entry-btn {
    display: inline-block;
    margin-top: 22px;
    padding: 14px 28px;
    background: #1a73e8;
    color: #fff;
    font-size: 16px;
    border-radius: 8px;
    text-decoration: none;
    transition: background .2s, transform .1s;
  }
  .entry-btn:hover { background: #1667d0; }
  .entry-btn:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="site-name">miaogan的小站</div>
    <a class="entry-btn" href="home.html">miaogan的浏览器主页</a>
  </div>
</body>
</html>
